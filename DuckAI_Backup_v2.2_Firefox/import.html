<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Duck.ai Backup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.4em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 20px;
            font-size: 0.85em;
        }
        
        .drop-zone {
            border: 3px dashed #ddd;
            border-radius: 10px;
            padding: 30px 20px;
            text-align: center;
            background: #f9f9f9;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .drop-zone:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .drop-zone.dragover {
            border-color: #667eea;
            background: #e8f0ff;
        }
        
        .drop-zone-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .drop-zone-text {
            font-size: 0.95em;
            color: #666;
            margin-bottom: 6px;
        }
        
        .drop-zone-hint {
            font-size: 0.8em;
            color: #999;
        }
        
        .file-input {
            display: none;
        }
        
        .result-box {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background: #f5f5f5;
            border: 2px solid #ddd;
        }
        
        .result-box.success {
            background: #e8f5e9;
            border-color: #4caf50;
        }
        
        .result-box.error {
            background: #ffebee;
            border-color: #f44336;
        }
        
        .progress-bar {
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #4caf50;
            transition: width 0.3s;
        }
        
        .result-text {
            color: #333;
            line-height: 1.6;
        }
        
        .imports-list {
            margin-top: 30px;
        }
        
        .import-item {
            background: #fff3e0;
            border: 1px solid #ffb74d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        
        .import-title {
            font-weight: 600;
            color: #e65100;
            margin-bottom: 5px;
        }
        
        .import-meta {
            font-size: 0.85em;
            color: #666;
        }
        
        button {
            margin-top: 20px;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📥 Import Duck.ai Backup</h1>
        <p class="subtitle">Import old Duck.ai export files (.txt, .md) to preserve your conversation history</p>
        
        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">📂</div>
            <div class="drop-zone-text">Click to select file or drag & drop</div>
            <div class="drop-zone-hint">Supports .txt and .md files</div>
        </div>
        
        <input type="file" id="fileInput" class="file-input" accept=".txt,.md,.markdown">
        
        <div id="resultBox" class="result-box">
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <div id="resultText" class="result-text"></div>
        </div>
        
        <button id="closeBtn" style="display: none; margin-bottom: 15px;">Close & Return to Extension</button>
        
        <div id="importsList" class="imports-list" style="display: none;">
            <h2>Your Imports</h2>
            <div id="importsContent"></div>
        </div>
    </div>
    
    <script src="import.js"></script>
</body>
</html>
