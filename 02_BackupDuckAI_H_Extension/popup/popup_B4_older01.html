<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            body {
                font-family:
                    system-ui,
                    Segoe UI,
                    Roboto,
                    sans-serif;
                padding: 12px;
                width: 320px;
            }
            .controls {
                display: flex;
                gap: 8px;
                margin-bottom: 8px;
            }
            #list {
                margin: 8px 0;
                padding: 0;
            }
            #list li {
                margin-bottom: 8px;
                line-height: 1.3;
                list-style: none;
                border: 1px solid #e1e5e9;
                border-radius: 4px;
                padding: 6px;
                background: #f8f9fa;
            }
            #list li:hover {
                background: #e9ecef;
            }
            #list label {
                display: flex;
                align-items: flex-start;
                cursor: pointer;
                gap: 8px;
            }
            #list input[type="checkbox"] {
                margin: 2px 0 0 0;
                flex-shrink: 0;
            }
            .title-text {
                flex: 1;
                font-size: 0.9em;
                line-height: 1.3;
                max-height: 2.6em; /* Approximately 2 lines */
                overflow: hidden;
                word-wrap: break-word;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
            }
            #status {
                font-size: 0.85em;
                color: #666;
                margin: 8px 0;
                min-height: 1.2em;
            }
            button {
                font-size: 0.85em;
                padding: 6px 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                background: #f5f5f5;
                cursor: pointer;
            }
            button:hover {
                background: #e9ecef;
            }
            #clearCache {
                font-size: 0.75em !important;
                padding: 3px 6px !important;
                color: #666;
            }
        </style>
    </head>
    <body>
        <div class="controls">
            <button id="toggleAll">Toggle All</button>
            <button
                id="refresh"
                title="Single-click to load (may use cache), Double-click to force refresh"
            >
                Load Chat-titles
            </button>
            <button id="downloadButton">Download .md</button>
        </div>
        <div class="controls">
            <button id="clearCache" style="font-size: 0.8em; padding: 4px 8px">
                Clear Cache
            </button>
        </div>

        <div id="status" aria-live="polite"></div>
        <ul id="list"></ul>

        <script src="../lib/jsencrypt.min.js"></script>
        <script src="../lib/crypto-js.min.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
